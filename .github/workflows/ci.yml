name: CI - Build y Pruebas

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Compilar, probar y generar reportes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y ejecutar todas las pruebas
        run: ./mvnw --batch-mode clean verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-pruebas-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: error
          retention-days: 30

      - name: Publicar aplicacion compilada
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: aplicacion-java-${{ github.run_number }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30