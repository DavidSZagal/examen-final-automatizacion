name: CD - Despliegue Blue-Green

on:
  workflow_run:
    workflows:
      - 'CI - Build y Pruebas'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-blue-green-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  quality-gate:
    name: Quality Gate y paquete
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar permisos
        run: |
          chmod +x mvnw
          chmod +x scripts/blue-green-deploy.sh

      - name: Ejecutar Quality Gate
        run: ./mvnw --batch-mode clean verify

      - name: Publicar paquete de despliegue
        uses: actions/upload-artifact@v7
        with:
          name: aplicacion-despliegue-${{ github.run_number }}
          path: target/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publicar reportes del Quality Gate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-quality-gate-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 30

  deploy-test:
    name: Desplegar y probar en TEST
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: test

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Descargar paquete
        uses: actions/download-artifact@v7
        with:
          name: aplicacion-despliegue-${{ github.run_number }}
          path: artefacto

      - name: Localizar paquete
        id: artefacto
        run: |
          JAR_PATH="$(find artefacto -type f -name '*.jar' | head -n 1)"
          if [[ -z "$JAR_PATH" ]]; then
            echo "No se encontro el archivo JAR"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Configurar permisos
        run: |
          chmod +x mvnw
          chmod +x scripts/blue-green-deploy.sh

      - name: Desplegar en ambiente TEST
        run: |
          HEALTHCHECK_PORT=18080 \
          bash scripts/blue-green-deploy.sh \
          "${{ steps.artefacto.outputs.jar_path }}" \
          target/test-blue-green

      - name: Ejecutar pruebas de aceptacion
        run: |
          ./mvnw --batch-mode \
          -Dit.test=ProductoAcceptanceTest \
          verify

      - name: Crear resumen del ambiente TEST
        if: always()
        run: |
          {
            echo "## Despliegue en ambiente TEST"
            echo ""
            echo "| Control | Resultado |"
            echo "| --- | --- |"
            echo "| Despliegue Blue-Green | Ejecutado |"
            echo "| Health check | UP |"
            echo "| Pruebas de aceptacion | Ejecutadas |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar evidencia de TEST
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-test-${{ github.run_number }}
          path: |
            target/test-blue-green/deployment.log
            target/test-blue-green/state/
            target/test-blue-green/blue/metadata.txt
            target/test-blue-green/green/metadata.txt
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30

  deploy-production:
    name: Desplegar Blue-Green en PRODUCCION
    needs: deploy-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Descargar paquete aprobado
        uses: actions/download-artifact@v7
        with:
          name: aplicacion-despliegue-${{ github.run_number }}
          path: artefacto

      - name: Localizar paquete aprobado
        id: artefacto
        run: |
          JAR_PATH="$(find artefacto -type f -name '*.jar' | head -n 1)"
          if [[ -z "$JAR_PATH" ]]; then
            echo "No se encontro el archivo JAR aprobado"
            exit 1
          fi
          echo "jar_path=$JAR_PATH" >> "$GITHUB_OUTPUT"

      - name: Configurar permisos
        run: chmod +x scripts/blue-green-deploy.sh

      - name: Validar rollback automatico
        run: |
          set +e

          FORCE_HEALTHCHECK_FAILURE=true \
          bash scripts/blue-green-deploy.sh \
          "${{ steps.artefacto.outputs.jar_path }}" \
          target/rollback-validation

          RESULTADO=$?
          set -e

          if [[ "$RESULTADO" -ne 1 ]]; then
            echo "La simulacion debia activar el rollback"
            exit 1
          fi

          ACTIVE_SLOT="$(
            tr -d '\r\n ' \
            < target/rollback-validation/state/active-slot.txt
          )"

          if [[ "$ACTIVE_SLOT" != "blue" ]]; then
            echo "El trafico no permanecio en blue"
            exit 1
          fi

          grep --quiet "status=ROLLBACK" \
            target/rollback-validation/deployment.log

          echo "ROLLBACK AUTOMATICO VALIDADO"

      - name: Desplegar nueva version
        run: |
          HEALTHCHECK_PORT=18081 \
          bash scripts/blue-green-deploy.sh \
          "${{ steps.artefacto.outputs.jar_path }}" \
          target/production-blue-green

      - name: Crear resumen de PRODUCCION
        run: |
          ACTIVE_SLOT="$(
            tr -d '\r\n ' \
            < target/production-blue-green/state/active-slot.txt
          )"

          {
            echo "## Despliegue Blue-Green en PRODUCCION"
            echo ""
            echo "| Control | Resultado |"
            echo "| --- | --- |"
            echo "| Quality Gate | Aprobado |"
            echo "| Ambiente TEST | Aprobado |"
            echo "| Pruebas de aceptacion | Aprobadas |"
            echo "| Rollback automatico | Validado |"
            echo "| Health check | UP |"
            echo "| Slot activo | $ACTIVE_SLOT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar evidencia de despliegue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-produccion-${{ github.run_number }}
          path: |
            target/production-blue-green/deployment.log
            target/production-blue-green/state/
            target/production-blue-green/blue/metadata.txt
            target/production-blue-green/green/metadata.txt
            target/rollback-validation/deployment.log
            target/rollback-validation/state/
          if-no-files-found: warn
          retention-days: 30